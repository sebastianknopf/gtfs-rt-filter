[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-rt-filter"
version = "0.1.0"
description = "on-demand GTFS-Realtime filtering proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110", 
    "uvicorn>=0.27", 
    "httpx>=0.27", 
    "protobuf>=4.25", 
    "gtfs-realtime-bindings>=1.0.0", 
    "PyYAML>=6", 
    "pydantic>=2", 
    "shapely>=2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
gtfs-rt-filter = "gtfsrtfilter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
